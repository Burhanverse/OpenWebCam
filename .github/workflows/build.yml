name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S windows -B build -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/Release/OpenWebCam.dll, build/Release/OpenWebCamSetup.exe `
            -DestinationPath dist/OpenWebCam-windows-${{ matrix.arch }}.zip
          Copy-Item build/Release/owc-probe.exe dist/owc-probe-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: openwebcam-windows-${{ matrix.arch }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: bash ./gradlew --no-daemon :app:assembleRelease
      - name: Package
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/OpenWebCam-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: openwebcam-android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes \
            dist/OpenWebCam-windows-x64.zip dist/OpenWebCam-windows-ARM64.zip dist/OpenWebCam-android.apk
