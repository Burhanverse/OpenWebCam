name: build

# Every push to main builds, picks the next version from the commit messages,
# tags it and publishes a GitHub release with a changelog. PRs only build.
#
# Version bump since the last v* tag (Conventional Commits):
#   "feat!: ..." / "BREAKING CHANGE" in a body -> major
#   "feat: ..."                                 -> minor
#   anything else                               -> patch
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore"]
  pull_request:
  workflow_dispatch:

# Releases run one at a time so two quick pushes can't claim the same version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      code: ${{ steps.next.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version and changelog
        id: next
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            # First automated release: start from the version in app/build.gradle.kts.
            version=$(grep -oP 'versionName = .*?"\K[0-9]+\.[0-9]+\.[0-9]+' app/build.gradle.kts)
            range=HEAD
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            range="$last..HEAD"
            log=$(git log --no-merges --format='%s%n%b' "$range")
            if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<< "$log"; then
              version="$((major + 1)).0.0"
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
              version="$major.$((minor + 1)).0"
            else
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          IFS=. read -r major minor patch <<< "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
          echo "Next version: v$version (last: ${last:-none})"

          # Changelog grouped by commit type; the type prefix is stripped.
          breaking='^[a-z]+(\([^)]*\))?!:'
          feat='^feat(\([^)]*\))?:'
          fix='^fix(\([^)]*\))?:'
          perf='^perf(\([^)]*\))?:'
          section() {  # title, grep flags
            local title=$1 lines
            shift
            lines=$(git log --no-merges --format='%s|%h' "$range" | grep "$@" |
              sed -E 's/^[a-z]+(\([^)]*\))?!?: *//; s/^(.)/\U\1/; s/\|([0-9a-f]+)$/ (\1)/; s/^/- /' || true)
            if [ -n "$lines" ]; then printf '### %s\n\n%s\n\n' "$title" "$lines" >> notes.md; fi
          }
          : > notes.md
          section "Breaking changes" -E "$breaking"
          section "Features"         -E "$feat"
          section "Fixes"            -E "$fix"
          section "Performance"      -E "$perf"
          section "Other changes"    -vE "$breaking|$feat|$fix|$perf"
          [ -s notes.md ] || printf 'Maintenance release.\n\n' > notes.md
          printf '\n### Downloads\n\n| File | For |\n|---|---|\n| `OpenWebCam-android.apk` | Android 10 or later |\n| `OpenWebCam-windows-x64.zip` | Windows 11 on Intel / AMD |\n| `OpenWebCam-windows-ARM64.zip` | Windows 11 on ARM |\n| `OpenWebCam-linux.tar.gz` | Linux (builds on install, see README) |\n' >> notes.md
          if [ -n "$last" ]; then
            echo "" >> notes.md
            echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/$last...v$version" >> notes.md
          fi
          cat notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S windows -B build -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/Release/OpenWebCam.dll, build/Release/OpenWebCamSetup.exe `
            -DestinationPath dist/OpenWebCam-windows-${{ matrix.arch }}.zip
          Copy-Item build/Release/owc-probe.exe dist/owc-probe-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v7
        with:
          name: openwebcam-windows-${{ matrix.arch }}
          path: |
            dist/OpenWebCam-windows-${{ matrix.arch }}.zip
            dist/owc-probe-${{ matrix.arch }}.exe

  # Users build from source (FFmpeg's ABI differs per distro), so the
  # release ships the linux/ folder, not a binary.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libavcodec-dev libavutil-dev libswscale-dev
      - name: Build
        run: cmake -S linux -B build/linux && cmake --build build/linux
      - name: Check installer syntax
        run: sh -n linux/install.sh
      - name: Check service syntax
        run: systemd-analyze verify linux/openwebcam@.service
      - name: Package
        run: |
          chmod +x linux/install.sh
          mkdir -p dist
          tar -czf dist/OpenWebCam-linux.tar.gz linux
      - uses: actions/upload-artifact@v7
        with:
          name: openwebcam-linux
          path: dist/OpenWebCam-linux.tar.gz

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing; building with debug key fallback"
          fi
      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          bash ./gradlew --no-daemon :app:assembleRelease
          -PversionName=${{ needs.version.outputs.version }}
          -PversionCode=${{ needs.version.outputs.code }}
      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OpenWebCam-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: openwebcam-android
          path: dist/OpenWebCam-android.apk

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [version, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          # Creates the tag on this commit. Tags pushed with GITHUB_TOKEN don't trigger another run.
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "OpenWebCam $TAG" --notes-file dist/notes.md --clobber \
            dist/OpenWebCam-windows-x64.zip dist/OpenWebCam-windows-ARM64.zip dist/OpenWebCam-linux.tar.gz dist/OpenWebCam-android.apk
